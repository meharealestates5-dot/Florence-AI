
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08111f">
<title>Uniteaa AI</title>

<style>
:root {
 --bg:#08111f;
 --panel:#0d1a2b;
 --panel2:#122238;
 --line:#243b58;
 --text:#f4f7ff;
 --muted:#9db2cc;
 --blue:#2878d0;
 --blue2:#18375a;
}

* { box-sizing:border-box; }

html,body {
 width:100%;
 height:100%;
 margin:0;
 overflow:hidden;
}

body {
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 display:flex;
 height:100vh;
 height:100dvh;
}

button,textarea,input { font:inherit; }
button { cursor:pointer; }

.sidebar {
 width:245px;
 flex-shrink:0;
 background:var(--panel);
 padding:20px;
 display:flex;
 flex-direction:column;
 gap:12px;
 border-right:1px solid var(--line);
}

.logo {
 font-size:25px;
 font-weight:bold;
 margin:3px 0 18px;
}

.logo span { color:#75b7ff; }

.side-btn,.action {
 background:#172943;
 color:white;
 border:1px solid #2a4362;
 padding:11px 13px;
 border-radius:10px;
}

.side-btn:hover,.action:hover { background:#24466d; }

.creator {
 margin-top:auto;
 color:var(--muted);
 font-size:13px;
 line-height:1.6;
}

.main {
 flex:1;
 min-width:0;
 min-height:0;
 display:flex;
 flex-direction:column;
}

header {
 height:64px;
 flex-shrink:0;
 padding:18px 24px;
 border-bottom:1px solid #1d2c42;
 font-size:20px;
 font-weight:bold;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.online {
 font-size:12px;
 color:#8fe0b0;
 font-weight:normal;
}

#chat {
 flex:1;
 min-height:0;
 overflow-y:auto;
 padding:22px;
}

.message {
 max-width:900px;
 margin:0 auto 18px;
 padding:15px 17px;
 border-radius:13px;
 line-height:1.65;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}

.user { background:var(--blue2); }

.ai {
 background:var(--panel2);
 border:1px solid #203650;
}

.who {
 color:#8ebeff;
 font-size:12px;
 margin-bottom:6px;
 font-weight:bold;
}

.sources {
 margin-top:12px;
 padding-top:10px;
 border-top:1px solid #34506d;
 font-size:13px;
}

.sources a {
 display:block;
 color:#8fc4ff;
 margin-top:6px;
 overflow-wrap:anywhere;
}

.composer {
 padding:14px 20px 16px;
 border-top:1px solid #1d2c42;
 background:#0b1727;
 flex-shrink:0;
}

.input-row {
 max-width:1000px;
 margin:auto;
 display:flex;
 gap:9px;
 align-items:flex-end;
}

textarea {
 flex:1;
 min-width:0;
 resize:vertical;
 min-height:52px;
 max-height:160px;
 padding:15px;
 color:white;
 background:#14243a;
 border:1px solid #2c4564;
 border-radius:12px;
 font:inherit;
}

textarea:focus { outline:2px solid #2878d0; }

.action {
 font-size:14px;
 white-space:nowrap;
}

.send {
 background:var(--blue);
 font-weight:bold;
 border-color:var(--blue);
 min-height:52px;
 padding:0 20px;
}

.send:hover { background:#398be5; }

.tools {
 max-width:1000px;
 margin:10px auto 0;
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 align-items:center;
}

.toggle {
 display:flex;
 align-items:center;
 gap:6px;
 color:#c3d2e5;
 font-size:13px;
 padding:7px 9px;
 background:#122238;
 border:1px solid #2c4564;
 border-radius:9px;
}

.toggle input { accent-color:#398be5; }

#fileName {
 color:#a9bdd6;
 font-size:12px;
 max-width:220px;
 overflow:hidden;
 text-overflow:ellipsis;
}

#status {
 color:#9db5d1;
 font-size:12px;
 margin-top:9px;
 text-align:center;
 min-height:15px;
}

#fileInput { display:none; }

button:disabled {
 opacity:.55;
 cursor:not-allowed;
}

@media screen and (max-width:700px) {
 html,body {
  width:100%;
  height:100%;
  overflow:hidden;
 }

 body {
  height:100vh;
  height:100dvh;
  min-width:0;
 }

 .sidebar { display:none !important; }

 .main {
  width:100%;
  max-width:100%;
  min-width:0;
  min-height:0;
 }

 header {
  height:54px;
  min-height:54px;
  padding:10px 14px;
  font-size:18px;
 }

 #chat {
  width:100%;
  min-width:0;
  padding:12px;
 }

 .message {
  width:100%;
  max-width:100%;
  padding:12px;
  margin-bottom:12px;
  font-size:14px;
  overflow-wrap:anywhere;
  word-break:break-word;
 }

 .composer {
  width:100%;
  min-width:0;
  padding:9px;
  padding-bottom:max(9px,env(safe-area-inset-bottom));
 }

 .input-row {
  width:100%;
  display:flex;
  flex-wrap:nowrap;
  gap:7px;
 }

 textarea {
  flex:1;
  width:0;
  min-width:0;
  min-height:48px;
  max-height:110px;
  padding:12px;
  font-size:16px;
  resize:none;
 }

 .send {
  min-height:48px;
  padding:0 14px;
 }

 .tools {
  width:100%;
  max-width:100%;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
  max-height:112px;
  overflow-y:auto;
  padding:2px;
 }

 .tools .action {
  flex:1 1 calc(33.333% - 8px);
  min-width:0;
  max-width:100%;
  padding:9px 5px;
  font-size:12px;
  white-space:normal;
  overflow-wrap:anywhere;
 }

 .toggle {
  flex:1 1 auto;
  justify-content:center;
  font-size:12px;
 }

 #fileName {
  max-width:100%;
  flex:1 1 100%;
  text-align:center;
 }

 #status {
  font-size:11px;
  line-height:1.4;
  margin-top:7px;
 }
}

@media screen and (max-width:380px) {
 header {
  font-size:16px;
  padding:9px;
 }

 .tools .action { flex-basis:calc(50% - 6px); }
 .composer { padding:7px; }
 .message { font-size:13px; }
}
</style>
</head>

<body>

<aside class="sidebar">
 <div class="logo">Uniteaa <span>AI</span></div>
 <button class="side-btn" onclick="newChat()">＋ New Chat</button>
 <button class="side-btn" onclick="clearChat()">Clear Chat</button>

 <div class="creator">
  Created by<br>
  <b>M. Mehanethra</b>
 </div>
</aside>

<main class="main">

<header>
 <span>Uniteaa AI</span>
 <span class="online">● Online</span>
</header>

<section id="chat" aria-live="polite">
 <div class="message ai">
  <div class="who">UNITEAA AI</div>
  <div>Hello! I am Uniteaa AI. How can I help you today?</div>
 </div>
</section>

<section class="composer">

<div class="input-row">
 <textarea
  id="message"
  placeholder="Message Uniteaa AI..."
  rows="1"
 ></textarea>

 <button
  class="action send"
  id="sendBtn"
  onclick="sendMessage()"
 >Send</button>
</div>

<div class="tools">

 <button
  class="action"
  onclick="document.getElementById('fileInput').click()"
 >📎 Upload file</button>

 <input
  id="fileInput"
  type="file"
  accept=".pdf,.docx,.txt,.csv,.md,.json,.png,.jpg,.jpeg,.webp"
  onchange="showFileName()"
 >

 <button
  class="action"
  id="voiceBtn"
  onclick="startVoice()"
 >🎤 Dictate</button>

 <button
  class="action"
  onclick="speakLastAnswer()"
 >🔊 Read answer</button>

 <button
  class="action"
  onclick="stopSpeaking()"
 >■ Stop voice</button>

 <label class="toggle">
  <input id="liveSearch" type="checkbox" checked>
  Live search
 </label>

 <button class="action" onclick="downloadAnswer('txt')">TXT</button>
 <button class="action" onclick="downloadAnswer('pdf')">PDF</button>
 <button class="action" onclick="downloadAnswer('docx')">DOCX</button>

 <span id="fileName"></span>
</div>

<div id="status">
 Type a message, dictate, or upload a document or image.
</div>

</section>
</main>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const fileInput = document.getElementById("fileInput");

let lastAnswer = "";
let recognition = null;


function addMessage(text,type,sources=[]) {
 const box = document.createElement("div");
 box.className = "message " + type;

 const who = document.createElement("div");
 who.className = "who";
 who.textContent = type === "user" ? "YOU" : "UNITEAA AI";

 const content = document.createElement("div");
 content.textContent = text;

 box.append(who,content);

 if (sources && sources.length) {
  const sourceBox = document.createElement("div");
  sourceBox.className = "sources";

  const heading = document.createElement("b");
  heading.textContent = "Sources";
  sourceBox.appendChild(heading);

  sources.forEach(source => {
   if (!source.url) return;

   try {
    const url = new URL(source.url);

    if (!["http:","https:"].includes(url.protocol)) return;

    const link = document.createElement("a");
    link.href = url.href;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = source.title || url.hostname;

    sourceBox.appendChild(link);
   } catch (e) {}
  });

  if (sourceBox.children.length > 1) {
   box.appendChild(sourceBox);
  }
 }

 chat.appendChild(box);
 chat.scrollTop = chat.scrollHeight;

 return content;
}


function showFileName() {
 const file = fileInput.files[0];
 document.getElementById("fileName").textContent =
  file ? file.name : "";
}


async function sendMessage() {
 const message = input.value.trim();
 const file = fileInput.files[0];

 if (!message && !file) return;

 addMessage(
  message + (file ? "\n📎 " + file.name : ""),
  "user"
 );

 const formData = new FormData();

 formData.append("message",message);

 formData.append(
  "live_search",
  document.getElementById("liveSearch").checked
   ? "true"
   : "false"
 );

 if (file) {
  formData.append("file",file);
 }

 input.value = "";
 fileInput.value = "";
 showFileName();

 statusText.textContent = "Uniteaa AI is thinking...";

 const btn = document.getElementById("sendBtn");
 btn.disabled = true;

 try {
  const response = await fetch("/chat",{
   method:"POST",
   body:formData
  });

  const raw = await response.text();
  let data;

  try {
   data = JSON.parse(raw);
  } catch (error) {
   throw new Error(
    "The server returned an invalid response: " +
    raw.slice(0,250)
   );
  }

  if (!response.ok) {
   throw new Error(
    data.error || "Server error: " + response.status
   );
  }

  const answer =
   data.answer ||
   data.reply ||
   data.response ||
   data.output ||
   data.content ||
   data.result ||
   "";

  if (typeof answer !== "string" || !answer.trim()) {
   console.error("Unexpected response:",data);
   throw new Error(
    "The server did not return an answer. Please check the server logs."
   );
  }

  lastAnswer = answer.trim();

  addMessage(
   lastAnswer,
   "ai",
   data.sources || []
  );

  if (data.live_search_used) {
   statusText.textContent =
    "Answer received · Live search used · Provider: " +
    (data.provider || "AI");
  } else if (data.search_attempted) {
   statusText.textContent =
    "Answer received · No live search results were found · Provider: " +
    (data.provider || "AI");
  } else {
   statusText.textContent =
    "Answer received · Provider: " +
    (data.provider || "AI");
  }

 } catch (error) {
  console.error("Uniteaa AI error:",error);

  addMessage(
   "Sorry, I couldn't complete your request.\n\n" +
   error.message,
   "ai"
  );

  statusText.textContent = "Request failed. Please try again.";

 } finally {
  btn.disabled = false;
  input.focus();
 }
}


function startVoice() {
 const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

 if (!SpeechRecognition) {
  statusText.textContent =
   "Voice dictation is not supported. Try Chrome or Edge.";
  return;
 }

 if (recognition) {
  try { recognition.stop(); } catch (e) {}
 }

 recognition = new SpeechRecognition();
 recognition.lang = "en-IN";
 recognition.interimResults = true;
 recognition.continuous = false;

 let finalText = "";
 const originalText = input.value.trim();

 recognition.onstart = () => {
  statusText.textContent = "Listening... Speak now.";
  document.getElementById("voiceBtn").textContent =
   "🎙 Listening";
 };

 recognition.onresult = event => {
  let interim = "";

  for (
   let i = event.resultIndex;
   i < event.results.length;
   i++
  ) {
   const transcript = event.results[i][0].transcript;

   if (event.results[i].isFinal) {
    finalText += transcript + " ";
   } else {
    interim += transcript;
   }
  }

  input.value =
   (originalText + " " + finalText + interim).trim();
 };

 recognition.onerror = event => {
  statusText.textContent = "Voice error: " + event.error;
 };

 recognition.onend = () => {
  input.value =
   (originalText + " " + finalText).trim();

  statusText.textContent = finalText.trim()
   ? "Voice added to your message."
   : "Voice dictation stopped.";

  document.getElementById("voiceBtn").textContent =
   "🎤 Dictate";

  input.focus();
 };

 try {
  recognition.start();
 } catch (error) {
  statusText.textContent = "Could not start voice input.";
 }
}


function speakLastAnswer() {
 if (!lastAnswer) {
  statusText.textContent =
   "There is no answer to read aloud yet.";
  return;
 }

 if (!("speechSynthesis" in window)) {
  statusText.textContent =
   "Voice output is not supported.";
  return;
 }

 window.speechSynthesis.cancel();

 const utterance =
  new SpeechSynthesisUtterance(lastAnswer);

 utterance.lang = "en-IN";
 utterance.rate = 1;

 utterance.onstart = () => {
  statusText.textContent = "Reading answer aloud...";
 };

 utterance.onend = () => {
  statusText.textContent = "Finished reading.";
 };

 window.speechSynthesis.speak(utterance);
}


function stopSpeaking() {
 if ("speechSynthesis" in window) {
  window.speechSynthesis.cancel();
 }

 if (recognition) {
  try { recognition.stop(); } catch (e) {}
 }

 statusText.textContent = "Voice playback stopped.";
}


async function downloadAnswer(format) {
 if (!lastAnswer) {
  statusText.textContent =
   "There is no answer to download yet.";
  return;
 }

 const endpoint =
  format === "txt" ? "/download" : "/export/" + format;

 try {
  const response = await fetch(endpoint,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({answer:lastAnswer})
  });

  if (!response.ok) {
   let error = {};

   try { error = await response.json(); } catch (e) {}

   throw new Error(
    error.error || "Download failed."
   );
  }

  const blob = await response.blob();
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = "uniteaa_ai_answer." + format;

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url),1000);

  statusText.textContent =
   format.toUpperCase() + " downloaded.";

 } catch (error) {
  statusText.textContent = error.message;
 }
}


function newChat() {
 stopSpeaking();

 chat.innerHTML = "";
 lastAnswer = "";

 addMessage(
  "Hello! I am Uniteaa AI. How can I help you today?",
  "ai"
 );

 statusText.textContent = "New chat started.";
}


function clearChat() {
 newChat();
}


input.addEventListener("keydown",event => {
 if (
  event.key === "Enter" &&
  !event.shiftKey
 ) {
  event.preventDefault();
  sendMessage();
 }
});
</script>

</body>
</html>
