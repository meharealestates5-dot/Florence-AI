
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florence AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101522;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    padding: 20px;
    background: #171f31;
    border-bottom: 1px solid #26364d;
    text-align: center;
}

header h1 {
    margin: 0;
    color: #38cfff;
}

header p {
    color: #aab7cc;
    margin-bottom: 0;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.message {
    padding: 13px 16px;
    border-radius: 14px;
    max-width: 85%;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    align-self: flex-end;
    background: #087da9;
}

.ai {
    align-self: flex-start;
    background: #222e43;
}

footer {
    display: flex;
    gap: 10px;
    padding: 15px;
    background: #171f31;
}

input {
    flex: 1;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #35445b;
    background: #222e43;
    color: white;
    outline: none;
    min-width: 0;
}

button {
    background: #08a9d8;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    opacity: 0.5;
}

</style>
</head>

<body>

<header>
    <h1>Florence AI</h1>
    <p>Your intelligent AI assistant</p>
</header>

<div id="chat">
    <div class="message ai">
        Hello! I am Florence AI.
        What would you like to know today?
    </div>
</div>

<footer>
    <input id="message"
           type="text"
           placeholder="Ask Florence anything..."
           autocomplete="off">

    <button id="send" onclick="sendMessage()">Send</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendButton = document.getElementById("send");

let history = [];

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

async function sendMessage() {
    const message = input.value.trim();

    if (!message || sendButton.disabled) return;

    addMessage(message, "user");
    input.value = "";
    sendButton.disabled = true;

    const loading = addMessage("Florence AI is thinking...", "ai");

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message,
                history: history
            })
        });

        const data = await response.json();

        loading.textContent = data.reply || "No answer received.";

        if (response.ok) {
            history.push(
                { role: "user", content: message },
                { role: "assistant", content: loading.textContent }
            );

            history = history.slice(-12);
        }

    } catch (error) {
        loading.textContent =
            "Connection error. Please try again.";
    }

    sendButton.disabled = false;
    input.focus();
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
