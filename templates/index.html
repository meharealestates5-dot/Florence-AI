
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uniteaa AI</title>

<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #08111f;
    color: #f4f7ff;
    height: 100vh;
    display: flex;
}
.sidebar {
    width: 245px;
    background: #0d1a2b;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.logo { font-size: 25px; font-weight: bold; margin-bottom: 18px; }
.sidebar button {
    background: #172943;
    color: white;
    border: 1px solid #263c59;
    padding: 12px;
    border-radius: 9px;
    cursor: pointer;
}
.sidebar button:hover, .action:hover { background: #24466d; }
.creator { margin-top: auto; color: #9aacc4; font-size: 13px; }
.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}
header {
    padding: 18px 24px;
    border-bottom: 1px solid #1d2c42;
    font-size: 20px;
    font-weight: bold;
}
#chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
}
.message {
    max-width: 850px;
    margin: 0 auto 18px;
    padding: 15px 17px;
    border-radius: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
.user { background: #18375a; }
.ai { background: #122238; border: 1px solid #203650; }
.who { color: #8ebeff; font-size: 12px; margin-bottom: 6px; }
.composer {
    padding: 15px 20px 18px;
    border-top: 1px solid #1d2c42;
    background: #0b1727;
}
.input-row {
    max-width: 950px;
    margin: auto;
    display: flex;
    gap: 9px;
    align-items: center;
}
textarea {
    flex: 1;
    min-width: 0;
    resize: vertical;
    min-height: 52px;
    max-height: 160px;
    padding: 15px;
    color: white;
    background: #14243a;
    border: 1px solid #2c4564;
    border-radius: 12px;
    font: inherit;
}
.action {
    border: 0;
    border-radius: 10px;
    background: #1b3b60;
    color: white;
    padding: 13px 15px;
    cursor: pointer;
    font-size: 14px;
}
.send { background: #2878d0; font-weight: bold; }
.send:hover { background: #398be5; }
.tools {
    max-width: 950px;
    margin: 10px auto 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
}
#fileName { color: #a9bdd6; font-size: 12px; }
#status { color: #9db5d1; font-size: 12px; margin-top: 8px; text-align: center; }
#fileInput { display: none; }
@media(max-width:700px) {
    .sidebar { width: 65px; padding: 10px 6px; }
    .logo { font-size: 13px; writing-mode: vertical-rl; }
    .sidebar button { font-size: 10px; padding: 9px 3px; }
    .creator { font-size: 9px; overflow-wrap: anywhere; }
    header { padding: 15px; }
    #chat { padding: 12px; }
    .composer { padding: 10px; }
    .input-row { flex-wrap: wrap; }
    textarea { flex-basis: 100%; }
    .action { padding: 11px; }
}
</style>
</head>

<body>
<aside class="sidebar">
    <div class="logo">Uniteaa AI</div>
    <button onclick="newChat()">＋ New Chat</button>
    <button onclick="clearChat()">Clear Chat</button>
    <div class="creator">Created by<br><b>M. Mehanethra</b></div>
</aside>

<main class="main">
    <header>Uniteaa AI <span style="color:#75b7ff">●</span></header>

    <section id="chat">
        <div class="message ai">
            <div class="who">UNITEAA AI</div>
            Hello! I am Uniteaa AI. How can I help you today?
        </div>
    </section>

    <section class="composer">
        <div class="input-row">
            <textarea id="message" placeholder="Message Uniteaa AI..." rows="1"></textarea>
            <button class="action send" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>

        <div class="tools">
            <button class="action" onclick="document.getElementById('fileInput').click()">📎 Upload file</button>
            <input id="fileInput" type="file"
                accept=".pdf,.docx,.txt,.csv,.png,.jpg,.jpeg,.webp"
                onchange="showFileName()">

            <button class="action" onclick="startVoice()">🎤 Voice</button>
            <button class="action" onclick="downloadAnswer('txt')">TXT</button>
            <button class="action" onclick="downloadAnswer('pdf')">PDF</button>
            <button class="action" onclick="downloadAnswer('docx')">DOCX</button>
            <span id="fileName"></span>
        </div>
        <div id="status">Upload a document or image, use voice dictation, or type a message.</div>
    </section>
</main>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const fileInput = document.getElementById("fileInput");

let lastAnswer = "";

function addMessage(text, type) {
    const box = document.createElement("div");
    box.className = "message " + type;

    const who = document.createElement("div");
    who.className = "who";
    who.textContent = type === "user" ? "YOU" : "UNITEAA AI";

    const content = document.createElement("div");
    content.textContent = text;

    box.appendChild(who);
    box.appendChild(content);
    chat.appendChild(box);
    chat.scrollTop = chat.scrollHeight;
}

function showFileName() {
    const file = fileInput.files[0];
    document.getElementById("fileName").textContent =
        file ? file.name : "";
}

async function sendMessage() {
    const message = input.value.trim();
    const file = fileInput.files[0];

    if (!message && !file) return;

    addMessage(
        message + (file ? "\n📎 " + file.name : ""),
        "user"
    );

    const formData = new FormData();
    formData.append("message", message);
    if (file) formData.append("file", file);

    input.value = "";
    fileInput.value = "";
    showFileName();

    statusText.textContent = "Uniteaa AI is thinking...";
    document.getElementById("sendBtn").disabled = true;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Something went wrong.");
        }

        lastAnswer = data.answer || "";
        addMessage(lastAnswer, "ai");
        statusText.textContent = "Response received.";
    } catch (error) {
        addMessage("Error: " + error.message, "ai");
        statusText.textContent = "Please try again.";
    } finally {
        document.getElementById("sendBtn").disabled = false;
    }
}

function startVoice() {
    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        statusText.textContent =
            "Voice dictation is not supported by this browser. Try a supported version of Chrome or Edge.";
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    recognition.interimResults = false;
    recognition.continuous = false;

    recognition.onstart = () => {
        statusText.textContent = "Listening... Speak now.";
    };

    recognition.onresult = (event) => {
        const spoken = event.results[0][0].transcript;
        input.value = (input.value + " " + spoken).trim();
        statusText.textContent = "Voice added to your message.";
        input.focus();
    };

    recognition.onerror = (event) => {
        statusText.textContent = "Voice error: " + event.error;
    };

    recognition.onend = () => {
        if (statusText.textContent === "Listening... Speak now.") {
            statusText.textContent = "Voice dictation stopped.";
        }
    };

    recognition.start();
}

async function downloadAnswer(format) {
    if (!lastAnswer) {
        statusText.textContent = "There is no answer to download yet.";
        return;
    }

    const endpoint = format === "txt"
        ? "/download"
        : "/export/" + format;

    try {
        const response = await fetch(endpoint, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({answer: lastAnswer})
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || "Download failed.");
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "uniteaa_ai_answer." + format;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);

        statusText.textContent = format.toUpperCase() + " downloaded.";
    } catch (error) {
        statusText.textContent = error.message;
    }
}

function newChat() {
    chat.innerHTML = "";
    lastAnswer = "";
    addMessage("Hello! I am Uniteaa AI. How can I help you today?", "ai");
    statusText.textContent = "New chat started.";
}

function clearChat() {
    newChat();
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});
</script>
</body>
</html>
