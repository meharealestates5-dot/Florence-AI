
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florence AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080d19;
    color: white;
    height: 100vh;
    display: flex;
}

.sidebar {
    width: 250px;
    background: #101827;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #36d9ff;
    margin-bottom: 20px;
}

.sidebar button {
    padding: 13px;
    border: 1px solid #263b52;
    background: #172438;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
}

.sidebar button:hover {
    background: #17415b;
}

.creator {
    margin-top: auto;
    color: #9baec3;
    font-size: 13px;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

header {
    padding: 20px;
    border-bottom: 1px solid #253248;
    font-size: 21px;
    font-weight: bold;
    color: #36d9ff;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.welcome {
    text-align: center;
    margin: auto;
}

.welcome h1 {
    font-size: 35px;
    color: #36d9ff;
    margin-bottom: 12px;
}

.welcome p {
    color: #a7b6c8;
}

.message {
    max-width: 80%;
    padding: 14px 18px;
    border-radius: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    align-self: flex-end;
    background: #075985;
}

.bot {
    align-self: flex-start;
    background: #172438;
    border: 1px solid #293d55;
}

.input-area {
    padding: 18px;
    display: flex;
    gap: 10px;
    border-top: 1px solid #253248;
}

input {
    flex: 1;
    min-width: 0;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #354b64;
    outline: none;
    background: #111c2d;
    color: white;
    font-size: 16px;
}

#send {
    background: #06b6d4;
    color: #06121c;
    font-weight: bold;
    padding: 0 25px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}

#send:disabled {
    opacity: 0.5;
    cursor: wait;
}

@media(max-width:650px) {
    .sidebar {
        width: 75px;
        padding: 10px;
    }

    .logo {
        font-size: 13px;
        overflow-wrap: anywhere;
    }

    .sidebar button {
        font-size: 11px;
        padding: 9px 5px;
    }

    .creator {
        display: none;
    }

    #chat {
        padding: 12px;
    }

    .message {
        max-width: 95%;
    }
}
</style>
</head>

<body>

<aside class="sidebar">

    <div class="logo">✦ Florence AI</div>

    <button onclick="newChat()">＋ New Chat</button>

    <button onclick="clearChat()">🗑 Clear Chat</button>

    <div class="creator">
        Developed by<br>
        <strong>M. Mehanethra</strong>
        <br><br>
        Your AI Assistant
    </div>

</aside>

<main class="main">

    <header>✦ Florence AI</header>

    <section id="chat">

        <div class="welcome" id="welcome">
            <h1>Hello! 👋</h1>
            <p>Welcome to Florence AI.</p>
            <p>Ask me anything. Let's explore together!</p>
        </div>

    </section>

    <div class="input-area">

        <input
            id="message"
            type="text"
            placeholder="Ask Florence AI anything..."
            autocomplete="off"
        >

        <button id="send" onclick="sendMessage()">
            Send
        </button>

    </div>

</main>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendButton = document.getElementById("send");

let history = [];

function addMessage(text, type) {

    const welcome = document.getElementById("welcome");

    if (welcome) welcome.remove();

    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

}

async function sendMessage() {

    const message = input.value.trim();

    if (!message || sendButton.disabled) return;

    addMessage(message, "user");

    input.value = "";
    sendButton.disabled = true;

    const loading = document.createElement("div");

    loading.className = "message bot";
    loading.textContent = "Florence AI is thinking...";

    chat.appendChild(loading);

    chat.scrollTop = chat.scrollHeight;

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message,
                history: history
            })

        });

        const data = await response.json();

        loading.remove();

        if (!response.ok) {
            throw new Error(data.reply || "Server error");
        }

        const reply = data.reply || "I couldn't generate an answer.";

        addMessage(reply, "bot");

        history.push({
            role: "user",
            content: message
        });

        history.push({
            role: "assistant",
            content: reply
        });

    } catch (error) {

        loading.remove();

        addMessage(
            "Connection error: " + error.message,
            "bot"
        );

    } finally {

        sendButton.disabled = false;
        input.focus();

    }

}

function newChat() {

    chat.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>Hello! 👋</h1>
            <p>Welcome to Florence AI.</p>
            <p>Ask me anything. Let's explore together!</p>
        </div>
    `;

    history = [];

    input.value = "";

}

function clearChat() {

    newChat();

}

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
