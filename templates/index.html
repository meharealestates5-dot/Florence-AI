
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08111f">
<title>Uniteaa AI</title>
<style>
:root {
 --bg:#08111f;--panel:#0d1a2b;--panel2:#122238;
 --line:#243b58;--text:#f4f7ff;--muted:#9db2cc;
 --blue:#2878d0;--blue2:#18375a;
}
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;background:var(--bg);
 color:var(--text);height:100vh;display:flex;overflow:hidden;
}
button,textarea,input{font:inherit}
.sidebar{
 width:245px;flex-shrink:0;background:var(--panel);padding:20px;
 display:flex;flex-direction:column;gap:12px;
 border-right:1px solid var(--line);
}
.logo{font-size:25px;font-weight:bold;margin:3px 0 18px}
.logo span{color:#75b7ff}
.side-btn,.action{
 background:#172943;color:white;border:1px solid #2a4362;
 padding:11px 13px;border-radius:10px;cursor:pointer;
}
.side-btn:hover,.action:hover{background:#24466d}
.creator{margin-top:auto;color:var(--muted);font-size:13px;line-height:1.6}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header{
 height:64px;flex-shrink:0;padding:18px 24px;
 border-bottom:1px solid #1d2c42;font-size:20px;font-weight:bold;
 display:flex;justify-content:space-between;align-items:center;
}
.online{font-size:12px;color:#8fe0b0;font-weight:normal}
#chat{flex:1;overflow-y:auto;padding:22px}
.message{
 max-width:900px;margin:0 auto 18px;padding:15px 17px;
 border-radius:13px;line-height:1.65;white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user{background:var(--blue2)}
.ai{background:var(--panel2);border:1px solid #203650}
.who{color:#8ebeff;font-size:12px;margin-bottom:6px;font-weight:bold}
.composer{
 padding:14px 20px 16px;border-top:1px solid #1d2c42;
 background:#0b1727;flex-shrink:0;
}
.input-row{
 max-width:1000px;margin:auto;display:flex;gap:9px;align-items:flex-end;
}
textarea{
 flex:1;min-width:0;resize:vertical;min-height:52px;max-height:160px;
 padding:15px;color:white;background:#14243a;
 border:1px solid #2c4564;border-radius:12px;font:inherit;
}
textarea:focus{outline:2px solid #2878d0}
.action{font-size:14px;white-space:nowrap}
.send{
 background:var(--blue);font-weight:bold;border-color:var(--blue);
 min-height:52px;padding:0 20px;
}
.send:hover{background:#398be5}
.tools{
 max-width:1000px;margin:10px auto 0;display:flex;
 flex-wrap:wrap;gap:8px;align-items:center;
}
.toggle{
 display:flex;align-items:center;gap:6px;color:#c3d2e5;
 font-size:13px;padding:7px 9px;background:#122238;
 border:1px solid #2c4564;border-radius:9px;
}
.toggle input{accent-color:#398be5}
#fileName{color:#a9bdd6;font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
#status{color:#9db5d1;font-size:12px;margin-top:9px;text-align:center;min-height:15px}
#fileInput{display:none}
#imagePanel{
 display:none;max-width:1000px;margin:0 auto 9px;padding:12px;
 background:#122238;border:1px solid #2c4564;border-radius:12px;
}
#imagePanel.open{display:block}
.image-row{display:flex;gap:8px}
.image-row input{
 flex:1;min-width:0;padding:12px;background:#0b1727;color:white;
 border:1px solid #2c4564;border-radius:9px;
}
button:disabled{opacity:.55;cursor:not-allowed}
.generated-image{max-width:100%;height:auto;border-radius:12px;margin-top:10px}
@media(max-width:700px){
 .sidebar{width:66px;padding:10px 6px;gap:9px}
 .logo{font-size:12px;writing-mode:vertical-rl;margin:5px auto 15px}
 .side-btn{font-size:10px;padding:9px 3px}
 .creator{font-size:9px;overflow-wrap:anywhere}
 header{padding:15px;height:56px}
 #chat{padding:12px}
 .composer{padding:10px}
 .input-row{flex-wrap:wrap}
 textarea{flex-basis:100%}
 .send{flex:1}
 .action{padding:10px}
 .image-row{flex-wrap:wrap}
 .image-row input{flex-basis:100%}
}
</style>
</head>
<body>

<aside class="sidebar">
 <div class="logo">Uniteaa <span>AI</span></div>
 <button class="side-btn" onclick="newChat()">＋ New Chat</button>
 <button class="side-btn" onclick="clearChat()">Clear Chat</button>
 <div class="creator">Created by<br><b>M. Mehanethra</b></div>
</aside>

<main class="main">
<header>
 <span>Uniteaa AI</span>
 <span class="online">● Online</span>
</header>

<section id="chat" aria-live="polite">
 <div class="message ai">
  <div class="who">UNITEAA AI</div>
  <div>Hello! I am Uniteaa AI. How can I help you today?</div>
 </div>
</section>

<section class="composer">

<div id="imagePanel">
 <div class="image-row">
  <input id="imagePrompt" type="text"
   placeholder="Describe the image you want to create...">
  <button class="action send" id="imageBtn"
   onclick="generateImage()">Generate image</button>
  <button class="action" onclick="toggleImagePanel(false)">Close</button>
 </div>
</div>

<div class="input-row">
 <textarea id="message" placeholder="Message Uniteaa AI..." rows="1"></textarea>
 <button class="action send" id="sendBtn" onclick="sendMessage()">Send</button>
</div>

<div class="tools">
 <button class="action" onclick="document.getElementById('fileInput').click()">📎 Upload file</button>
 <input id="fileInput" type="file"
  accept=".pdf,.docx,.txt,.csv,.png,.jpg,.jpeg,.webp"
  onchange="showFileName()">
 <button class="action" id="voiceBtn" onclick="startVoice()">🎤 Dictate</button>
 <button class="action" onclick="speakLastAnswer()">🔊 Read answer</button>
 <button class="action" onclick="stopSpeaking()">■ Stop voice</button>
 <button class="action" onclick="toggleImagePanel()">🎨 Create image</button>
 <label class="toggle"><input id="liveSearch" type="checkbox" checked> Live search</label>
 <button class="action" onclick="downloadAnswer('txt')">TXT</button>
 <button class="action" onclick="downloadAnswer('pdf')">PDF</button>
 <button class="action" onclick="downloadAnswer('docx')">DOCX</button>
 <span id="fileName"></span>
</div>

<div id="status">Type a message, dictate, or upload a document or image.</div>
</section>
</main>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");
const statusText=document.getElementById("status");
const fileInput=document.getElementById("fileInput");

let lastAnswer="";
let recognition=null;

function addMessage(text,type){
 const box=document.createElement("div");
 box.className="message "+type;
 const who=document.createElement("div");
 who.className="who";
 who.textContent=type==="user"?"YOU":"UNITEAA AI";
 const content=document.createElement("div");
 content.textContent=text;
 box.append(who,content);
 chat.appendChild(box);
 chat.scrollTop=chat.scrollHeight;
 return content;
}

function addImage(image){
 const box=addMessage("Generated image","ai");
 const img=document.createElement("img");
 img.src=image;
 img.alt="Image generated by Uniteaa AI";
 img.className="generated-image";
 box.appendChild(img);
 chat.scrollTop=chat.scrollHeight;
}

function showFileName(){
 const file=fileInput.files[0];
 document.getElementById("fileName").textContent=file?file.name:"";
}

async function sendMessage(){
 const message=input.value.trim();
 const file=fileInput.files[0];
 if(!message&&!file)return;

 addMessage(message+(file?"\n📎 "+file.name:""),"user");

 const formData=new FormData();
 formData.append("message",message);
 formData.append("live_search",
  document.getElementById("liveSearch").checked?"true":"false");
 if(file)formData.append("file",file);

 input.value="";
 fileInput.value="";
 showFileName();

 statusText.textContent="Uniteaa AI is thinking...";
 const btn=document.getElementById("sendBtn");
 btn.disabled=true;

 try{
  const response=await fetch("/chat",{method:"POST",body:formData});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Something went wrong.");

  lastAnswer=data.answer||"";
  addMessage(lastAnswer,"ai");
  statusText.textContent=data.live_search_used?
   "Response received · Live search used.":"Response received.";
 }catch(error){
  addMessage("Error: "+error.message,"ai");
  statusText.textContent="Please try again.";
 }finally{
  btn.disabled=false;
  input.focus();
 }
}

function startVoice(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  statusText.textContent="Voice dictation is not supported. Try Chrome or Edge.";
  return;
 }

 if(recognition){
  try{recognition.stop();}catch(e){}
 }

 recognition=new SpeechRecognition();
 recognition.lang="en-IN";
 recognition.interimResults=true;
 recognition.continuous=false;

 let finalText="";
 const originalText=input.value.trim();

 recognition.onstart=()=>{
  statusText.textContent="Listening... Speak now.";
  document.getElementById("voiceBtn").textContent="🎙 Listening";
 };

 recognition.onresult=(event)=>{
  let interim="";
  for(let i=event.resultIndex;i<event.results.length;i++){
   const t=event.results[i][0].transcript;
   if(event.results[i].isFinal)finalText+=t+" ";
   else interim+=t;
  }
  input.value=(originalText+" "+finalText+interim).trim();
 };

 recognition.onerror=(event)=>{
  statusText.textContent="Voice error: "+event.error;
 };

 recognition.onend=()=>{
  input.value=(originalText+" "+finalText).trim();
  statusText.textContent=finalText.trim()?
   "Voice added to your message.":"Voice dictation stopped.";
  document.getElementById("voiceBtn").textContent="🎤 Dictate";
  input.focus();
 };

 try{recognition.start();}
 catch(e){statusText.textContent="Could not start voice input.";}
}

function speakLastAnswer(){
 if(!lastAnswer){
  statusText.textContent="There is no answer to read aloud yet.";
  return;
 }
 if(!("speechSynthesis" in window)){
  statusText.textContent="Voice output is not supported.";
  return;
 }
 window.speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(lastAnswer);
 utterance.lang="en-IN";
 utterance.rate=1;
 utterance.onstart=()=>statusText.textContent="Reading answer aloud...";
 utterance.onend=()=>statusText.textContent="Finished reading.";
 window.speechSynthesis.speak(utterance);
}

function stopSpeaking(){
 if("speechSynthesis" in window)window.speechSynthesis.cancel();
 statusText.textContent="Voice playback stopped.";
}

async function downloadAnswer(format){
 if(!lastAnswer){
  statusText.textContent="There is no answer to download yet.";
  return;
 }
 const endpoint=format==="txt"?"/download":"/export/"+format;
 try{
  const response=await fetch(endpoint,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({answer:lastAnswer})
  });
  if(!response.ok){
   const error=await response.json();
   throw new Error(error.error||"Download failed.");
  }
  const blob=await response.blob();
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download="uniteaa_ai_answer."+format;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  statusText.textContent=format.toUpperCase()+" downloaded.";
 }catch(error){
  statusText.textContent=error.message;
 }
}

function toggleImagePanel(force){
 const panel=document.getElementById("imagePanel");
 const open=typeof force==="boolean"?force:!panel.classList.contains("open");
 panel.classList.toggle("open",open);
 if(open)document.getElementById("imagePrompt").focus();
}

async function generateImage(){
 const prompt=document.getElementById("imagePrompt").value.trim();
 if(!prompt){
  statusText.textContent="Enter an image description first.";
  return;
 }

 const btn=document.getElementById("imageBtn");
 btn.disabled=true;
 statusText.textContent="Creating your image...";

 try{
  const response=await fetch("/generate-image",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({prompt})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Image generation failed.");
  if(!data.image)throw new Error("No image was returned.");
  addImage(data.image);
  statusText.textContent="Image generated successfully.";
  document.getElementById("imagePrompt").value="";
 }catch(error){
  addMessage("Image generation error: "+error.message,"ai");
  statusText.textContent="Image generation failed.";
 }finally{
  btn.disabled=false;
 }
}

function newChat(){
 stopSpeaking();
 chat.innerHTML="";
 lastAnswer="";
 addMessage("Hello! I am Uniteaa AI. How can I help you today?","ai");
 statusText.textContent="New chat started.";
}

function clearChat(){newChat();}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

document.getElementById("imagePrompt").addEventListener("keydown",e=>{
 if(e.key==="Enter")generateImage();
});
</script>
</body>
</html>
